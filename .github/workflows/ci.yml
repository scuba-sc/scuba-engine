name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coordinated-core:
    name: coordinated core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      CORE_COMMIT: 1b6782bc5c8b7d189cdff4c83e81957f09af35d7
      CORE_KIT_SHA256: 9db31895ffc0806e663fca36be4bbad2d25c231cf9ae894008743d345e78ae3e
    steps:
      # The hosted Windows default can rewrite LF files. This runner is ephemeral;
      # disable conversion before both checkouts so the source bytes stay exact.
      - name: Keep checkout bytes unchanged
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: scuba-sc/sco-core
          ref: 1b6782bc5c8b7d189cdff4c83e81957f09af35d7
          path: coordinated-core
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - name: Build and verify exact development host-source kit
        shell: bash
        run: |
          test "$(git -C coordinated-core rev-parse HEAD)" = "$CORE_COMMIT"
          test -z "$(git -C coordinated-core status --porcelain --untracked-files=no)"
          python tools/package_dev_sdk.py coordinated-core sdk-artifacts
          python tools/verify_dev_sdk.py sdk-artifacts/sco-sdk-host-source-sc-2.4.0.zip "$CORE_KIT_SHA256" "$CORE_COMMIT"
      - name: Configure against coordinated core kit
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            cmake -S . -B build-coordinated -A x64 \
              -DSCUBA_SDK_ARCHIVE_DIR:PATH="$GITHUB_WORKSPACE/sdk-artifacts" \
              -DSCUBA_SDK_HOST_SOURCE_SHA256="$CORE_KIT_SHA256"
          else
            cmake -S . -B build-coordinated -DCMAKE_BUILD_TYPE=Release \
              -DSCUBA_SDK_ARCHIVE_DIR:PATH="$GITHUB_WORKSPACE/sdk-artifacts" \
              -DSCUBA_SDK_HOST_SOURCE_SHA256="$CORE_KIT_SHA256"
          fi
      - name: Build
        run: cmake --build build-coordinated --config Release --parallel
      - name: Test
        run: ctest --test-dir build-coordinated -C Release --output-on-failure

  native:
    name: native (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Configure (downloads and verifies the sco-core host-source kit)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            cmake -S . -B build -A x64
          else
            cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          fi
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - uses: actions/setup-node@v4
        if: runner.os == 'Linux'
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: studio/package-lock.json
      - name: Studio loader against native asset output
        if: runner.os == 'Linux'
        working-directory: studio
        run: |
          npm ci
          SCUBA_ASSET_FIXTURES="$GITHUB_WORKSPACE/build/tests/assets-fixtures" npx vitest run src/panels/assets/loader.test.ts

  studio:
    name: studio
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: studio/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
