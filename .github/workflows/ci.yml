name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coordinated-core:
    name: coordinated core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      CORE_COMMIT: 6106fa3639cbcc28f78a1ded8de2707de019f4d3
      CORE_KIT_SHA256: a0aaaba07e3d4eb0d8c264912cd6f2ab23f0d237a99fa07816005790a76efc4c
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - name: Download and verify the published host-source kit
        shell: bash
        run: |
          mkdir -p sdk-artifacts
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/scuba-sc/sco-core/releases/download/sdk-v2.4.0/sco-sdk-host-source-sc-2.4.0.zip" \
            --output sdk-artifacts/sco-sdk-host-source-sc-2.4.0.zip
          python tools/curated_mock_host/verify_archive.py \
            sdk-artifacts/sco-sdk-host-source-sc-2.4.0.zip "$CORE_KIT_SHA256" "$CORE_COMMIT"
      - name: Configure against coordinated core kit
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            cmake -S . -B build-coordinated -A x64 \
              -DSCUBA_SDK_ARCHIVE_DIR:PATH="$GITHUB_WORKSPACE/sdk-artifacts" \
              -DSCUBA_SDK_HOST_SOURCE_SHA256="$CORE_KIT_SHA256"
          else
            cmake -S . -B build-coordinated -DCMAKE_BUILD_TYPE=Release \
              -DSCUBA_SDK_ARCHIVE_DIR:PATH="$GITHUB_WORKSPACE/sdk-artifacts" \
              -DSCUBA_SDK_HOST_SOURCE_SHA256="$CORE_KIT_SHA256"
          fi
      - name: Build
        run: cmake --build build-coordinated --config Release --parallel
      - name: Test
        run: ctest --test-dir build-coordinated -C Release --output-on-failure

  native:
    name: native (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify published plugin SDK archive
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p sdk-plugin-artifacts
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/scuba-sc/sco-core/releases/download/sdk-v2.4.0/sco-sdk-2.4.0.zip \
            --output sdk-plugin-artifacts/sco-sdk-2.4.0.zip
          echo "0df4995624e9b094d24e9c5534b1ea7357f517c83a0a8c8ed6ad7d4d475afcbc  sdk-plugin-artifacts/sco-sdk-2.4.0.zip" \
            | sha256sum --check
      - name: Configure (downloads and verifies the sco-core host-source kit)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            cmake -S . -B build -A x64
          elif [ "$RUNNER_OS" = "Linux" ]; then
            cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
              -DSCUBA_TEST_PLUGIN_SDK_CONSUMER=ON \
              -DSCUBA_PLUGIN_SDK_ARCHIVE_PATH="$GITHUB_WORKSPACE/sdk-plugin-artifacts/sco-sdk-2.4.0.zip"
          else
            echo "Unsupported native runtime platform: $RUNNER_OS" >&2
            exit 1
          fi
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - uses: actions/setup-node@v4
        if: runner.os == 'Linux'
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: studio/package-lock.json
      - name: Studio loader against native asset output
        if: runner.os == 'Linux'
        working-directory: studio
        run: |
          npm ci
          SCUBA_ASSET_FIXTURES="$GITHUB_WORKSPACE/build/tests/assets-fixtures" npx vitest run src/panels/assets/loader.test.ts

  studio:
    name: studio
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: studio/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
