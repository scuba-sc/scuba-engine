name: curated mock host

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: curated-mock-${{ github.ref }}
  cancel-in-progress: true

jobs:
  curated:
    name: curated mock (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      CORE_COMMIT: 6106fa3639cbcc28f78a1ded8de2707de019f4d3
      CORE_KIT_SHA256: a0aaaba07e3d4eb0d8c264912cd6f2ab23f0d237a99fa07816005790a76efc4c
    steps:
      - name: Keep checkout bytes unchanged
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: x64
      - name: Download and verify the published host-source kit
        shell: bash
        run: |
          mkdir -p curated-artifacts
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/scuba-sc/sco-core/releases/download/sdk-v2.4.0/sco-sdk-host-source-sc-2.4.0.zip" \
            --output curated-artifacts/sco-sdk-host-source-sc-2.4.0.zip
          python tools/curated_mock_host/verify_archive.py \
            curated-artifacts/sco-sdk-host-source-sc-2.4.0.zip "$CORE_KIT_SHA256" "$CORE_COMMIT"
      - name: Configure curated composition
        shell: bash
        run: |
          cmake_args=(-DCMAKE_BUILD_TYPE=Release -DSCUBA_RESERVED_MOCK_HOST_ONLY=ON \
            "-DSCUBA_RESERVED_CORE_COMMIT=$CORE_COMMIT" \
            "-DSCUBA_SDK_ARCHIVE_DIR=$GITHUB_WORKSPACE/curated-artifacts" \
            "-DSCUBA_SDK_HOST_SOURCE_SHA256=$CORE_KIT_SHA256")
          if [ "$RUNNER_OS" = "Windows" ]; then cmake_args+=(-A x64); fi
          cmake -S . -B build-curated "${cmake_args[@]}"
      - name: Build curated host and tests
        run: cmake --build build-curated --config Release --parallel
      - name: Test lifecycle, output copy, negative controls and composition
        run: ctest --test-dir build-curated -C Release --output-on-failure --output-junit ctest.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: curated-test-evidence-${{ matrix.os }}
          path: |
            build-curated/ctest.xml
            build-curated/Release/scuba-reserved-hostd.map
          if-no-files-found: warn
